<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masters Applications - Summer 2027</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Masters Applications - Summer 2027</h1>
    <div class="actions">
      <button id="logoutBtn" hidden>Log out</button>
    </div>
  </header>

  <main id="loginView" hidden>
    <form id="loginForm">
      <input type="email" id="email" placeholder="Email" required autocomplete="username">
      <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
      <button type="submit">Log in</button>
    </form>
    <p id="loginError" class="error"></p>
  </main>

  <nav id="tabs" hidden></nav>

  <main id="appView" hidden>
    <section id="summary"></section>

    <section id="studentBar">
      <label>Student name <input type="text" id="studentName"></label>
      <button type="button" id="addBtn">+ Add application</button>
    </section>

    <dialog id="appDialog">
      <form id="appForm">
        <h2 id="dialogTitle">Add application</h2>
        <label>University <input type="text" id="university" required></label>
        <label>Program <input type="text" id="program" required></label>
        <label>Deadline <input type="date" id="deadline"></label>
        <label>IELTS <input type="text" id="ielts" placeholder="e.g. 6 or 5.5 or MOI"></label>
        <label>GRE <select id="gre"></select></label>
        <label>Portal <select id="portal"></select></label>
        <label>Status <select id="status"></select></label>
        <label>Link <input type="url" id="link" placeholder="https://..."></label>
        <label>Notes <input type="text" id="notes"></label>
        <div class="dialog-actions">
          <button type="button" id="cancelBtn" class="secondary">Cancel</button>
          <button type="submit">Save</button>
        </div>
      </form>
    </dialog>

    <table>
      <thead>
        <tr>
          <th>Student</th><th>University</th><th>Program</th><th>Deadline</th>
          <th>IELTS</th><th>GRE</th><th>Portal</th><th>Status</th><th>Link</th><th>Notes</th><th>Actions</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <p id="empty" hidden>No applications yet.</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
